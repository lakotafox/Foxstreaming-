<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoxStream - Loading</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    .logo {
      width: 120px;
      height: 120px;
      margin: 0 auto 2rem;
      background: linear-gradient(135deg, #ff6b35 0%, #f7931e 50%, #ffcc00 100%);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2s ease-in-out infinite;
    }

    .logo svg {
      width: 60px;
      height: 60px;
      fill: white;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #ff6b35, #f7931e, #ffcc00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      color: #888;
      font-size: 1.1rem;
      margin-bottom: 3rem;
    }

    .loader {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 107, 53, 0.2);
      border-top-color: #ff6b35;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status {
      color: #f7931e;
      font-size: 1rem;
    }

    .services {
      margin-top: 2rem;
      display: flex;
      gap: 2rem;
      justify-content: center;
    }

    .service {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #666;
      font-size: 0.9rem;
    }

    .service .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #333;
      animation: blink 1.5s ease-in-out infinite;
    }

    .service:nth-child(1) .dot { animation-delay: 0s; }
    .service:nth-child(2) .dot { animation-delay: 0.5s; }
    .service:nth-child(3) .dot { animation-delay: 1s; }

    @keyframes blink {
      0%, 100% { background: #333; }
      50% { background: #f7931e; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z"/>
      </svg>
    </div>
    <h1>FoxStream</h1>
    <p class="tagline">Stream Beyond Limits</p>

    <div class="loader">
      <div class="spinner"></div>
      <span class="status">Starting services...</span>
    </div>

    <div class="services">
      <div class="service">
        <span class="dot"></span>
        <span>Streaming Engine</span>
      </div>
      <div class="service">
        <span class="dot"></span>
        <span>Media Proxy</span>
      </div>
      <div class="service">
        <span class="dot"></span>
        <span>Content API</span>
      </div>
    </div>
  </div>
</body>
</html>
