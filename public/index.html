    body {

      background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
      min-height: 100vh;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      text-align: center;
    }

    .logo {
      width: 120px;
      height: 120px;
      margin-bottom: 20px;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(247, 147, 30, 0.3);
    }

    h1 {
      font-size: 3rem;
      background: linear-gradient(135deg, #ff6b35, #f7931e, #ffcc00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }

    .tagline {
      font-size: 1.2rem;
      color: #888;
      margin-bottom: 40px;
    }

    .downloads {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .download-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 30px;
      transition: all 0.3s ease;
    }

    .download-card:hover {
      background: rgba(255,255,255,0.08);
      border-color: #f7931e;
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(247, 147, 30, 0.2);
    }

    .platform-icon {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    .platform-name {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .platform-desc {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 20px;
    }

    .download-btn {
      display: inline-block;
      background: linear-gradient(135deg, #ff6b35, #f7931e);
      color: #fff;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .download-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 24px rgba(247, 147, 30, 0.4);
    }

    .features {
      display: flex;
      gap: 30px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }

    .feature {
      display: flex;
      align-items: center;

    }

    .feature-icon {

    .footer {
      color: #555;
      font-size: 0.85rem;
